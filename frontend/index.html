<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1e1e2e" />
    <title>Physics IDE</title>

    <!-- Fonts are requested by styles.css @import; these preconnects warm the origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

        <!-- GlowScript / VPython 3D engine vendored files load same-origin;
          AMD-define conflicts handled by frontend/src/utils/monaco/amdGuard.js -->

    <script>
      // Lightweight diagnostics used by src/utils/glowRunner.js
      window.__GS_DIAG = function () {
        return {
          jQuery: !!window.jQuery,
          jQueryUiResizable:
            !!(window.jQuery && window.jQuery.fn && window.jQuery.fn.resizable),
          GlowScript: !!window.GlowScript,
          glowscript_compile: typeof window.glowscript_compile,
          call_acorn_parse: typeof window.call_acorn_parse,
          acorn_parse:
            window.acorn && typeof window.acorn.parse !== "undefined"
              ? typeof window.acorn.parse
              : "missing",
        };
      };
    </script>

  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
